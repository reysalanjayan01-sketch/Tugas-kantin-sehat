<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantin Sehat - Menu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-utensils"></i> Kantin Sehat</h1>
            <nav>
                <a href="#" class="nav-active"><i class="fas fa-list"></i> Menu</a>
                <a href="transaksi.html"><i class="fas fa-shopping-cart"></i> Transaksi</a>
                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </header>
        
        <div class="content">
            <div class="page-header">
                <h2><i class="fas fa-concierge-bell"></i> Menu Produk Kantin Sehat</h2>
                <p>Pilih produk yang ingin dibeli</p>
            </div>
            
            <div class="products-grid" id="productsContainer">
                <!-- Produk akan dimuat via JavaScript -->
            </div>
            
            <div class="selected-products">
                <h3><i class="fas fa-shopping-cart"></i> Produk Terpilih</h3>
                <div id="selectedProducts">
                    <p class="empty-message">Belum ada produk terpilih</p>
                </div>
                <div class="actions">
                    <button id="clearSelection" class="btn-secondary">
                        <i class="fas fa-trash"></i> Hapus Semua
                    </button>
                    <button id="goToTransaction" class="btn-primary">
                        <i class="fas fa-arrow-right"></i> Lanjut ke Transaksi
                    </button>
                </div>
            </div>
        </div>
        
        <footer>
            <p>Ujian Praktik Terpadu Kelas XI RPL &copy; 2024</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
